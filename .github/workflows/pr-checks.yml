# managed by AI kit
# ai-kit-version: 0.3.1-dev
# AI kit: PR checks (spec/05 §1, §8). Built by `ai-team ci render` from the project overlay — change it through the overlay and render again.
# The «ai-kit:keep» blocks survive a repeated render — the project's services and env go there.
# Draft PR — the checks are skipped. Required checks for the branch protection: pr-result and ai-review.
# The PR description is read through the API, not from the event: PR fields fixed — «Re-run failed jobs» is enough (the edited event
# is not used: on a title edit the skipped jobs would report green on top of red).
# The «setup: …» steps are CI setup: red there means «CI is broken», not the PR's fault (DEC-0071); the other steps are PR checks.
# ci-baseline (with lint or typecheck): warnings not more than in .github/ai-team/ci-baseline.json (DEC-0112); the base — `ai-team ci baseline`, through a PR.
# A push to the integration branch — the same checks on its head (without process guard and the PR's e2e): a check step red there too means «CI is broken»,
# not «the PR is at fault» for every PR (ai-team ci why, watch).
name: pr-checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    if: github.event_name == 'merge_group' || github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ai-kit:keep checks-services
    # ai-kit:keep-end
    # ai-kit:keep checks-env
    # ai-kit:keep-end
    steps:
      - name: "setup: start time"
        # The time of the checks for the ci-baseline step (DEC-0112).
        run: echo "AI_TEAM_CI_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: "setup: checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "setup: node"
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: "setup: install"
        run: |
          npm ci
      - name: process guard
        # Process guard checks the PR (description, zones, team rules) — a push to the integration branch has no PR.
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # A merge group has no PR description — the PR template fields and Tasks: are not checked there.
          if [ -n "$PR" ]; then
            body="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body --jq .body)" || { echo "could not read the description of PR #$PR"; exit 1; }
            export PR_BODY="$body"
          fi
          node .github/ai-team/process-guard.mjs --base "$GUARD_BASE"
      - name: typecheck
        # The output also goes to a file for the ci-baseline step (DEC-0112): the command line first, as written (not expanded: no env values in the log);
        # pipefail keeps the code of the command.
        run: |
          set -o pipefail
          {
          cat <<'AI_KIT_CMD'
          + npm run typecheck
          AI_KIT_CMD
          npm run typecheck
          } 2>&1 | tee "$RUNNER_TEMP/ai-kit-typecheck.log"
      - name: lint
        run: |
          set -o pipefail
          {
          cat <<'AI_KIT_CMD'
          + npm run lint
          AI_KIT_CMD
          npm run lint
          } 2>&1 | tee "$RUNNER_TEMP/ai-kit-lint.log"
      - name: unit
        run: |
          npm run test
      - name: "setup: openspec"
        # The CI machine has no OpenSpec CLI: it is installed only when the PR has openspec/ (a change).
        # A project that pins @fission-ai/openspec uses that version from node_modules (its install step); only an unpinned one gets the global 1.x.
        if: hashFiles('openspec/**') != ''
        run: |
          if node -e 'const p=require("./package.json");process.exit(p.dependencies?.["@fission-ai/openspec"]||p.devDependencies?.["@fission-ai/openspec"]?0:1)' && [ -x node_modules/.bin/openspec ]; then
            echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          else
            command -v openspec >/dev/null || npm install -g @fission-ai/openspec@1 --no-fund --no-audit
          fi
      - name: openspec validate
        if: hashFiles('openspec/**') != ''
        run: |
          npx --yes @fission-ai/openspec@1.17.0 validate --all --strict
      - name: build
        run: |
          VITE_APP_API_URL=https://dummyjson.com npm run build
      - name: ci-baseline — warnings and time against the base
        # Warnings of lint and typecheck against .github/ai-team/ci-baseline.json of the base commit (a PR does not loosen its own threshold):
        # more by over 10 % and by at least 1 — red, the PR's fault; the time — only a warning: shared CI machines jump by ±20 % (DEC-0112).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ ! -f .github/ai-team/ci-baseline.mjs ]; then echo "not measured: no .github/ai-team/ci-baseline.mjs — update the AI kit"; exit 0; fi
          node .github/ai-team/ci-baseline.mjs check --base "$BASE_SHA" --started "${AI_TEAM_CI_T0:-}" "$RUNNER_TEMP/ai-kit-typecheck.log" "$RUNNER_TEMP/ai-kit-lint.log"
  e2e-targeted:
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
      pull-requests: read # the PR description via gh pr view (its own permissions block replaces the top one entirely)
    # ai-kit:keep e2e-services
    # ai-kit:keep-end
    # ai-kit:keep e2e-env
    # ai-kit:keep-end
    steps:
      - name: "setup: checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "setup: node"
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: "setup: workers"
        # Workers — half of the cores of the CI machine (DEC-0069).
        run: |
          w=$(( $(nproc) / 2 )); [ "$w" -ge 1 ] || w=1
          echo "AI_TEAM_E2E_WORKERS=$w" >> "$GITHUB_ENV"
      - name: "setup: install"
        run: |
          npm ci
      - name: "setup: e2e browsers"
        run: |
          npx playwright install --with-deps chromium
      - name: build
        run: |
          VITE_APP_API_URL=https://dummyjson.com npm run build
      - name: "e2e — from the E2E: field, affected by the changes (e2e-map) and smoke; quarantine does not block"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          body="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body --jq .body)" || { echo "could not read the description of PR #$PR"; exit 1; }
          export PR_BODY="$body"
          # $(…), not < <(…): node failed — the step failed. Empty — no targets (not one empty target «»).
          out="$(node .github/ai-team/process-guard.mjs e2e-targets --base "$BASE_SHA" --regex)"
          targets=()
          [ -n "$out" ] && mapfile -t targets <<<"$out"
          # All targets are in quarantine — «no tests» is not red.
          if [ ${#targets[@]} -gt 0 ]; then
            export PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/e2e-results.json" PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report PLAYWRIGHT_HTML_REPORT=playwright-report
            npx playwright test "${targets[@]}" --workers=$AI_TEAM_E2E_WORKERS --grep-invert @quarantine --pass-with-no-tests --reporter=list,json,html
          fi
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/e2e-smoke.json" PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-smoke PLAYWRIGHT_HTML_REPORT=playwright-report-smoke
          npx playwright test --grep @smoke --workers=$AI_TEAM_E2E_WORKERS --grep-invert @quarantine --pass-with-no-tests --reporter=list,json,html
      - name: quarantine — runs, does not block (spec/05 §6)
        continue-on-error: true
        run: |
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/e2e-quarantine.json"
          npx playwright test --workers=$AI_TEAM_E2E_WORKERS --grep @quarantine --pass-with-no-tests --reporter=list,json
      - name: flaky → issue tracker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ai-team/flaky-report.mjs e2e-results.json e2e-smoke.json e2e-quarantine.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-targeted-report
          path: |
            playwright-report/
            playwright-report-smoke/
            test-results/
            e2e-*.json
          retention-days: 14
  pr-result:
    # One required check instead of many: skipped (draft, another event) is not red.
    if: always()
    needs: [checks, e2e-targeted]
    runs-on: ubuntu-latest
    steps:
      - name: result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) echo "red: $RESULTS"; exit 1 ;; esac; done
          echo "ok: $RESULTS"
